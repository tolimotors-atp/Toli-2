name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_ADSENSE_PUBLISHER_ID: ${{ vars.VITE_ADSENSE_PUBLISHER_ID || 'ca-pub-4857877397305724' }}
          VITE_ADSENSE_SLOT_AFTER_GALLERY: ${{ vars.VITE_ADSENSE_SLOT_AFTER_GALLERY }}
          VITE_ADSENSE_SLOT_BEFORE_FOOTER: ${{ vars.VITE_ADSENSE_SLOT_BEFORE_FOOTER }}
          VITE_ADS_ENABLED: ${{ vars.VITE_ADS_ENABLED }}
          VITE_ADS_LIVE_AUTHORIZED: ${{ vars.VITE_ADS_LIVE_AUTHORIZED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
